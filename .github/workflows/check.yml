name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: .venv/bin/ruff check .

      - name: Ruff (format)
        run: .venv/bin/ruff format --check build.py models pipeline scripts

      - name: Pyright
        run: .venv/bin/pyright

      - name: Compile all sources
        run: .venv/bin/python -m compileall -q build.py models pipeline scripts

      - name: Smoke test (exporters on an empty database)
        run: .venv/bin/python scripts/smoke_test.py
